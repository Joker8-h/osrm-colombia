name: Build OSRM Colombia

# Construye arlysv/osrm-colombia en la nube (runner 16GB RAM)
# y la publica en DockerHub sin usar tu PC.
on:
  workflow_dispatch:
    inputs:
      pbf_url:
        description: "URL del PBF"
        default: "https://download.geofabrik.de/south-america/colombia-latest.osm.pbf"
        required: true
      tag:
        description: "Tag a publicar"
        default: "2026.09"
        required: true

env:
  IMAGE: arlysv/osrm-colombia

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # El runner trae poco disco libre: liberamos ~20GB (android, dotnet, haskell...)
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Download Colombia PBF
        run: |
          mkdir -p data
          wget -O data/colombia-latest.osm.pbf "${{ inputs.pbf_url }}"
          ls -lh data/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # extract + partition + customize dentro del Dockerfile (etapa builder).
      # Colombia tarda 2-3h en este runner.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
